[project]
name = "evopacks"
# Mirrors version.json, which is the stamp the tooling reads. PEP 621 wants a
# PEP 440 version here; version.json (five-segment) stays authoritative.
version = "0.0.0.1"
description = "Build, catalog, and freshness-check regulatory content packs for evo.ai"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "zstandard>=0.22",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16"]          # also needs tesseract + ghostscript on PATH
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
evopacks = "evopacks.cli:main"

[tool.setuptools.packages.find]
include = ["evopacks*"]

[tool.ruff]
line-length = 100
target-version = "py311"
